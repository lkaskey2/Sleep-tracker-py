<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sleep Tracker</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/simple-statistics/7.8.3/simple-statistics.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;--surface:#161b22;--surface2:#1c2128;
  --border:#21262d;--border2:#30363d;
  --blue:#58a6ff;--green:#3fb950;--red:#f85149;--orange:#f0883e;
  --text:#e6edf3;--muted:#7d8590;
}
body{background:var(--bg);color:var(--text);font-family:Inter,-apple-system,sans-serif;min-height:100vh}
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

/* NAV */
.nav{background:var(--surface);border-bottom:1px solid var(--border);padding:0 16px;display:flex;align-items:center;gap:0;overflow-x:auto;scrollbar-width:none;position:sticky;top:0;z-index:100}
.nav::-webkit-scrollbar{display:none}
.nav-brand{font-size:14px;font-weight:700;color:var(--text);padding:14px 16px 14px 0;white-space:nowrap;border-right:1px solid var(--border);margin-right:8px}
.nav-tab{padding:14px 14px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;transition:all .15s}
.nav-tab.active{color:var(--blue);border-bottom-color:var(--blue)}
.nav-tab:hover:not(.active){color:var(--text)}

/* LAYOUT */
.page{padding:20px 16px;max-width:900px;margin:0 auto}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:14px}
.card-title{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);border-bottom:1px solid var(--border);padding-bottom:8px;margin-bottom:14px}
.section-title{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}

/* GRID */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}

/* FORM */
label.field-label{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;background:var(--bg);border:1px solid var(--border2);border-radius:6px;
  color:var(--text);font-family:inherit;font-size:14px;padding:9px 12px;outline:none;
  transition:border-color .15s
}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}
select option{background:var(--surface2)}

/* CHECKBOX */
.chk-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);cursor:pointer;margin-bottom:6px}
.chk-row input[type=checkbox],.chk-row input[type=radio]{accent-color:var(--blue);width:15px;height:15px;cursor:pointer;flex-shrink:0}

/* RADIO GROUP */
.radio-group{display:flex;gap:14px;flex-wrap:wrap}
.radio-group label{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--text);cursor:pointer}
.radio-group input[type=radio]{accent-color:var(--blue);width:14px;height:14px}

/* BUTTONS */
.btn{padding:10px 18px;border:none;border-radius:7px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.btn-primary{background:var(--green);color:#000;width:100%;padding:12px;font-size:14px}
.btn-primary:hover{background:#4ac95a}
.btn-sm{padding:5px 12px;font-size:12px;background:var(--surface2);color:var(--muted);border:1px solid var(--border)}

/* INFO BOX */
.info-box{background:var(--surface2);border:1px solid var(--border2);border-radius:6px;padding:8px 12px;font-size:11px;color:var(--muted);margin:6px 0}
.info-box strong{color:var(--text)}

/* METRICS */
.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.metric{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px 14px}
.metric-label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.metric-value{font-size:22px;font-weight:700;font-family:monospace;color:var(--blue)}
.metric-sub{font-size:11px;color:var(--muted);margin-top:2px}

/* ENTRY LIST */
.entry{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.entry-left{flex:1;min-width:0}
.entry-occ{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.entry-item{font-size:14px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry-meta{font-size:11px;color:var(--muted);margin-top:3px}
.entry-right{text-align:right;flex-shrink:0}

/* CORR BAR */
.corr-bar{height:8px;border-radius:4px;background:var(--border);overflow:hidden;margin:8px 0}
.corr-fill{height:100%;border-radius:4px;transition:width .4s}

/* SEE MORE */
.see-more{font-size:12px;color:var(--blue);cursor:pointer;padding:6px 0;display:inline-block}
.see-more:hover{text-decoration:underline}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--green);color:#000;padding:10px 22px;border-radius:20px;font-size:13px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999}
.toast.show{opacity:1}

/* MED INDENT */
.med-detail{padding-left:24px;margin-top:6px}

/* SPLIT BAR */
.split-bar{height:6px;border-radius:3px;background:var(--border);overflow:hidden;display:flex;margin:8px 0}

/* CHART CANVAS */
canvas{max-width:100%;margin:0 auto;display:block}

/* SYNC STATUS */
.sync-status{font-size:11px;padding:4px 10px;border-radius:12px;display:inline-flex;align-items:center;gap:5px}
.sync-ok{background:rgba(63,185,80,.15);color:var(--green)}
.sync-err{background:rgba(248,81,73,.15);color:var(--red)}
.sync-ing{background:rgba(88,166,255,.15);color:var(--blue)}

@media(max-width:600px){
  .grid2{grid-template-columns:1fr}
  .grid4{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>

<script type="text/babel">
const {useState,useEffect,useCallback,useMemo}=React;

// ── CONSTANTS ─────────────────────────────────────────────────────────────────
const BLUE="#58a6ff",GREEN="#3fb950",RED="#f85149",ORANGE="#f0883e",MUTED="#7d8590";

const PRESET_MEDS=[
  {name:"Vitamin A",   dose:20,  unit:"mg"},
  {name:"Vitamin K",   dose:100, unit:"mg"},
  {name:"Unisom",      dose:50,  unit:"mg"},
  {name:"Vitamin B12", dose:1000,unit:"mcg"},
  {name:"Magnesium",   dose:400, unit:"mg"},
  {name:"Magnesium Glyconate", dose:400, unit:"mg"},
  {name:"Magnesium Threonate", dose:2000,unit:"mg"},
  {name:"Vitamin C",   dose:500, unit:"mg"},
  {name:"L-Arginine",  dose:3000,unit:"mg"},
  {name:"L-Carnitine", dose:1800,unit:"mg"},
  {name:"Vitamin T",   dose:50,  unit:"mg"},
  {name:"Vitamin G",   dose:600, unit:"mg"},
];

const TIME_SLOTS=[
  {label:"AM Early (12:00 AM - 4:59 AM)", mid:2.5},
  {label:"AM (5:00 AM - 11:59 AM)",       mid:8.5},
  {label:"PM Early (12:00 PM - 4:59 PM)", mid:14.5},
  {label:"PM (5:00 PM - 11:59 PM)",       mid:20.5},
];

// ── HELPERS ───────────────────────────────────────────────────────────────────
function showToast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg;t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),2500);
}

function hrsBefore(medMid,bedH){
  let diff=bedH-medMid;
  if(diff<0)diff+=24;
  return diff.toFixed(1);
}

function adjustSleepDay(h){return(h>=0&&h<5)?h+24:h;}

function hrsBeforeBed(medMid,bedFloat){
  const m=adjustSleepDay(medMid);
  const b=adjustSleepDay(bedFloat);
  let d=b-m;if(d<0)d+=24;
  return Math.round(d*10)/10;
}

function bedFloat(hr,min,period){
  let h=parseInt(hr)%12+(period==="PM"?12:0);
  return h+parseInt(min)/60;
}

function pearsonR(xs,ys){
  if(xs.length<5)return{r:null,p:null};
  try{
    const r=ss.sampleCorrelation(xs,ys);
    const n=xs.length;
    const t=r*Math.sqrt((n-2)/(1-r*r));
    const p=2*(1-tDist(Math.abs(t),n-2));
    return{r:Math.round(r*1000)/1000,p:Math.round(p*10000)/10000};
  }catch{return{r:null,p:null};}
}

function tDist(t,df){
  // Approximation of t-distribution CDF
  const x=df/(df+t*t);
  let p=0.5*betaInc(x,df/2,0.5);
  return 1-p;
}

function betaInc(x,a,b){
  // Simple regularized incomplete beta approximation
  if(x<0||x>1)return 0;
  if(x===0)return 0;
  if(x===1)return 1;
  const lbeta=lgamma(a)+lgamma(b)-lgamma(a+b);
  return Math.exp(a*Math.log(x)+b*Math.log(1-x)-lbeta)/a/betaCF(x,a,b);
}

function betaCF(x,a,b){
  const MAXIT=200,EPS=3e-7;
  let qab=a+b,qap=a+1,qam=a-1;
  let c=1,d=1-qab*x/qap;
  if(Math.abs(d)<1e-30)d=1e-30;d=1/d;
  let h=d;
  for(let m=1;m<=MAXIT;m++){
    let m2=2*m;
    let aa=m*(b-m)*x/((qam+m2)*(a+m2));
    d=1+aa*d;if(Math.abs(d)<1e-30)d=1e-30;
    c=1+aa/c;if(Math.abs(c)<1e-30)c=1e-30;
    d=1/d;h*=d*c;
    aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));
    d=1+aa*d;if(Math.abs(d)<1e-30)d=1e-30;
    c=1+aa/c;if(Math.abs(c)<1e-30)c=1e-30;
    d=1/d;let del=d*c;h*=del;
    if(Math.abs(del-1)<EPS)break;
  }
  return h;
}

function lgamma(x){
  const c=[76.18009172947146,-86.50532032941677,24.01409824083091,
           -1.231739572450155,0.1208650973866179e-2,-0.5395239384953e-5];
  let y=x,tmp=x+5.5;
  tmp-=(x+0.5)*Math.log(tmp);
  let ser=1.000000000190015;
  for(let j=0;j<6;j++)ser+=c[j]/++y;
  return -tmp+Math.log(2.5066282746310005*ser/x);
}

function corrStrength(r){
  const a=Math.abs(r);
  if(a>=0.7)return"Strong";
  if(a>=0.4)return"Moderate";
  if(a>=0.2)return"Weak";
  return"Negligible";
}

const today=()=>new Date().toISOString().split("T")[0];

// ── GOOGLE SHEETS ─────────────────────────────────────────────────────────────
async function sheetsRequest(creds,method,url,body=null){
  // Get access token via service account JWT
  // Since browsers can't sign JWTs natively, we use the API key approach
  // User must provide their sheet ID and API key
  const opts={method,headers:{"Content-Type":"application/json","Authorization":`Bearer ${creds.token}`}};
  if(body)opts.body=JSON.stringify(body);
  const res=await fetch(url,opts);
  return res.json();
}

async function appendToSheet(sheetId,apiToken,row){
  const range="Sheet1";
  const url=`https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/${range}:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS`;
  const res=await fetch(url,{
    method:"POST",
    headers:{"Content-Type":"application/json","Authorization":`Bearer ${apiToken}`},
    body:JSON.stringify({values:[row]})
  });
  return res.ok;
}

// ── TIME PICKER ───────────────────────────────────────────────────────────────
function TimePicker({value,onChange,id}){
  const hours=[...Array(12)].map((_,i)=>String(i+1));
  const mins=["00","05","10","15","20","25","30","35","40","45","50","55"];
  const [hr,setHr]=useState(value?.hr||"11");
  const [mn,setMn]=useState(value?.mn||"00");
  const [period,setPeriod]=useState(value?.period||"PM");
  useEffect(()=>{onChange({hr,mn,period,float:bedFloat(hr,mn,period)});},[hr,mn,period]);
  return(
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 80px",gap:8}}>
      <div>
        <label className="field-label">Hr</label>
        <select value={hr} onChange={e=>setHr(e.target.value)}>
          {hours.map(h=><option key={h}>{h}</option>)}
        </select>
      </div>
      <div>
        <label className="field-label">Min</label>
        <select value={mn} onChange={e=>setMn(e.target.value)}>
          {mins.map(m=><option key={m}>{m}</option>)}
        </select>
      </div>
      <div>
        <label className="field-label">AM/PM</label>
        <select value={period} onChange={e=>setPeriod(e.target.value)}>
          <option>AM</option><option>PM</option>
        </select>
      </div>
    </div>
  );
}

// ── MED ROW ───────────────────────────────────────────────────────────────────
function MedRow({med,bedHr,onChange}){
  const [checked,setChecked]=useState(false);
  const [showAll,setShowAll]=useState(false);
  const doses=[med.dose*0.5,med.dose,med.dose*1.5,med.dose*2];
  const [selDose,setSelDose]=useState(1); // index
  const [slots,setSlots]=useState([false,false,false,false]);

  useEffect(()=>{
    if(!checked){onChange([]);return;}
    const rows=[];
    slots.forEach((on,i)=>{
      if(on){
        const hrs=hrsBeforeBed(TIME_SLOTS[i].mid,bedHr);
        rows.push({name:med.name,dose:`${doses[selDose]}${med.unit}`,
                   slot:TIME_SLOTS[i].label,hrs});
      }
    });
    onChange(rows);
  },[checked,selDose,slots,bedHr]);

  const toggleSlot=(i)=>setSlots(s=>s.map((v,j)=>j===i?!v:v));

  return(
    <div style={{marginBottom:10}}>
      <label className="chk-row">
        <input type="checkbox" checked={checked} onChange={e=>setChecked(e.target.checked)}/>
        <strong>{med.name}</strong>
      </label>
      {checked&&(
        <div className="med-detail">
          <div style={{fontSize:11,color:MUTED,marginBottom:4}}>Dose:</div>
          <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:8}}>
            {doses.map((d,i)=>(
              <label key={i} className="chk-row" style={{marginBottom:0}}>
                <input type="radio" name={`dose_${med.name}`}
                       checked={selDose===i} onChange={()=>setSelDose(i)}/>
                <span style={{fontSize:12,color:selDose===i?BLUE:MUTED}}>{d}{med.unit}</span>
              </label>
            ))}
          </div>
          <div style={{fontSize:11,color:MUTED,marginBottom:4}}>When taken:</div>
          <div className="grid2" style={{marginBottom:6}}>
            {TIME_SLOTS.map((slot,i)=>(
              <label key={i} className="chk-row" style={{fontSize:11}}>
                <input type="checkbox" checked={slots[i]} onChange={()=>toggleSlot(i)}/>
                <span style={{color:slots[i]?BLUE:MUTED}}>{slot.label}</span>
              </label>
            ))}
          </div>
          {slots.some(Boolean)&&(
            <div className="info-box">
              {TIME_SLOTS.filter((_,i)=>slots[i]).map((slot,i)=>(
                <div key={i}>⏱ {med.name} — <strong>{doses[selDose]}{med.unit}</strong> taken in the <strong>{slot.label}</strong> ({hrsBeforeBed(slot.mid,bedHr)} hrs before bed)</div>
              ))}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ── LOG TAB ───────────────────────────────────────────────────────────────────
function LogTab({onSave,gsheets}){
  const [date,setDate]=useState(today());
  const [bed,setBed]=useState({hr:"11",mn:"00",period:"PM",float:23});
  const [duration,setDuration]=useState(7);
  const [score,setScore]=useState(75);
  const [exercised,setExercised]=useState(false);
  const [exIntensity,setExIntensity]=useState("Moderate");
  const [stress,setStress]=useState("Med");
  const [workedLate,setWorkedLate]=useState(false);
  const [location,setLocation]=useState("Home");
  const [sleptWith,setSleptWith]=useState("Alone");
  const [events,setEvents]=useState("");
  const [notes,setNotes]=useState("");
  const [medData,setMedData]=useState({});
  const [showMoreMeds,setShowMoreMeds]=useState(false);
  const [saving,setSaving]=useState(false);

  const visibleMeds=showMoreMeds?PRESET_MEDS:PRESET_MEDS.slice(0,4);

  const handleMedChange=(medName,rows)=>{
    setMedData(prev=>({...prev,[medName]:rows}));
  };

  const allMedRows=Object.values(medData).flat();

  const handleSave=async()=>{
    setSaving(true);
    const entry={
      id:Date.now(),
      date,
      bedtime:`${bed.hr}:${bed.mn} ${bed.period}`,
      bedFloat:bed.float,
      duration:parseFloat(duration),
      score:parseInt(score),
      exercised,
      exIntensity:exercised?exIntensity:"",
      stress,
      workedLate,
      location,
      sleptWith,
      events,notes,
      meds:allMedRows,
      ts:new Date().toISOString()
    };
    await onSave(entry);
    setSaving(false);
    // Reset
    setDate(today());setDuration(7);setScore(75);
    setExercised(false);setStress("Med");setWorkedLate(false);
    setLocation("Home");setSleptWith("Alone");setEvents("");setNotes("");
    setMedData({});
  };

  return(
    <div className="page">
      <div className="grid2">
        {/* LEFT */}
        <div>
          <div className="card">
            <div style={{marginBottom:12}}>
              <label className="field-label">Sleep Date</label>
              <input type="date" value={date} onChange={e=>setDate(e.target.value)}/>
            </div>
            <div className="info-box" style={{marginBottom:12}}>
              📅 Sleep date is the date your day <strong>started</strong> (5:00 AM). Times between 12:00 AM–4:59 AM belong to this entry.
            </div>
            <label className="field-label">Bedtime</label>
            <TimePicker value={bed} onChange={setBed}/>
            <div className="grid2" style={{marginTop:12}}>
              <div>
                <label className="field-label">Duration (hrs)</label>
                <input type="number" value={duration} min="0" max="24" step="0.25"
                       onChange={e=>setDuration(e.target.value)}/>
              </div>
              <div>
                <label className="field-label">Sleep Score</label>
                <input type="number" value={score} min="0" max="100" step="1"
                       onChange={e=>setScore(e.target.value)}/>
              </div>
            </div>
          </div>
        </div>

        {/* RIGHT */}
        <div>
          <div className="card">
            <div className="card-title">Lifestyle</div>
            <div className="grid2" style={{alignItems:"center",marginBottom:10}}>
              <label className="chk-row">
                <input type="checkbox" checked={exercised} onChange={e=>setExercised(e.target.checked)}/>
                Exercised today
              </label>
              <div>
                <div style={{fontSize:10,color:MUTED,marginBottom:4}}>Stress</div>
                <div style={{display:"flex",gap:10}}>
                  {["Low","Med","High"].map(s=>(
                    <label key={s} className="chk-row" style={{marginBottom:0}}>
                      <input type="radio" name="stress" checked={stress===s} onChange={()=>setStress(s)}/>
                      <span style={{fontSize:12,color:s==="Low"?GREEN:s==="High"?RED:ORANGE}}>{s}</span>
                    </label>
                  ))}
                </div>
              </div>
            </div>
            {exercised&&(
              <div className="grid2" style={{marginBottom:10}}>
                <div>
                  <label className="field-label">Intensity</label>
                  <select value={exIntensity} onChange={e=>setExIntensity(e.target.value)}>
                    <option>Light</option><option>Moderate</option><option>Intense</option>
                  </select>
                </div>
              </div>
            )}
            <label className="chk-row" style={{marginBottom:10}}>
              <input type="checkbox" checked={workedLate} onChange={e=>setWorkedLate(e.target.checked)}/>
              Worked past 9 PM
            </label>
            <div style={{marginBottom:10}}>
              <div style={{fontSize:11,color:MUTED,marginBottom:6}}>Where did you sleep?</div>
              <div className="radio-group">
                {["Home","Elizabeth's","Hotel"].map(l=>(
                  <label key={l}><input type="radio" name="loc" checked={location===l} onChange={()=>setLocation(l)}/>{l}</label>
                ))}
              </div>
            </div>
            <div style={{marginBottom:10}}>
              <div style={{fontSize:11,color:MUTED,marginBottom:6}}>Slept with?</div>
              <div className="radio-group">
                {["Alone","Elizabeth"].map(w=>(
                  <label key={w}><input type="radio" name="with" checked={sleptWith===w} onChange={()=>setSleptWith(w)}/>{w}</label>
                ))}
              </div>
            </div>
            <div style={{marginBottom:10}}>
              <label className="field-label">One-off events</label>
              <input type="text" value={events} onChange={e=>setEvents(e.target.value)} placeholder="travel, illness…"/>
            </div>
            <div>
              <label className="field-label">Notes</label>
              <textarea value={notes} onChange={e=>setNotes(e.target.value)} rows={2} style={{resize:"vertical"}}/>
            </div>
          </div>
        </div>
      </div>

      {/* MEDS */}
      <div className="card">
        <div className="card-title">Medications / Supplements</div>
        {visibleMeds.map(med=>(
          <MedRow key={med.name} med={med} bedHr={bed.float}
                  onChange={rows=>handleMedChange(med.name,rows)}/>
        ))}
        <span className="see-more" onClick={()=>setShowMoreMeds(v=>!v)}>
          {showMoreMeds?"Show less":"See more"}
        </span>
        {allMedRows.length>0&&(
          <div className="info-box" style={{marginTop:8}}>
            {allMedRows.length} medication dose{allMedRows.length>1?"s":""} logged
          </div>
        )}
      </div>

      <button className="btn btn-primary" onClick={handleSave} disabled={saving}>
        {saving?"Saving…":"💾 Save Entry"}
      </button>
    </div>
  );
}

// ── DATA TAB ──────────────────────────────────────────────────────────────────
function DataTab({entries}){
  if(!entries.length)return(
    <div className="page" style={{textAlign:"center",padding:60,color:MUTED}}>
      <div style={{fontSize:36,marginBottom:10}}>🌙</div>
      No entries yet. Log your first night!
    </div>
  );
  const avg=arr=>arr.length?Math.round(arr.reduce((a,b)=>a+b,0)/arr.length*10)/10:0;
  const avgScore=avg(entries.map(e=>e.score));
  const avgDur=avg(entries.map(e=>e.duration));
  const exPct=Math.round(entries.filter(e=>e.exercised).length/entries.length*100);

  return(
    <div className="page">
      <div className="metric-grid">
        {[
          ["Avg Score",avgScore,"/100"],
          ["Avg Duration",avgDur+"h","per night"],
          ["Nights Logged",entries.length,"entries"],
          ["Exercise Days",exPct+"%","of nights"],
        ].map(([label,val,sub])=>(
          <div key={label} className="metric">
            <div className="metric-label">{label}</div>
            <div className="metric-value">{val}</div>
            <div className="metric-sub">{sub}</div>
          </div>
        ))}
      </div>

      <div className="card">
        <div className="card-title">Recent Entries</div>
        {[...entries].reverse().map(e=>(
          <div key={e.id} className="entry">
            <div className="entry-left">
              <div className="entry-occ">{e.date}</div>
              <div className="entry-item">
                Bedtime {e.bedtime} · {e.duration}h · Score {e.score}
              </div>
              <div className="entry-meta">
                {e.location} · {e.sleptWith} · Stress {e.stress}
                {e.exercised&&" · Exercised"}
                {e.workedLate&&" · Worked late"}
                {e.meds?.length>0&&` · ${e.meds.length} med(s)`}
              </div>
            </div>
            <div className="entry-right">
              <div style={{fontSize:22,fontWeight:700,fontFamily:"monospace",color:BLUE}}>{e.score}</div>
              <div style={{fontSize:10,color:MUTED,textTransform:"uppercase"}}>score</div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ── CORRELATIONS TAB ──────────────────────────────────────────────────────────
function CorrTab({entries}){
  const [target,setTarget]=useState("score");

  if(entries.length<5)return(
    <div className="page" style={{textAlign:"center",padding:60,color:MUTED}}>
      Need at least 5 nights of data for correlations.
    </div>
  );

  const factors=[
    {key:"exercised_n",label:"Exercised (0/1)",fn:e=>e.exercised?1:0},
    {key:"stress_n",label:"Stress (Low=1,Med=2,High=3)",fn:e=>({Low:1,Med:2,High:3}[e.stress]||2)},
    {key:"workedLate_n",label:"Worked Past 9 PM (0/1)",fn:e=>e.workedLate?1:0},
    {key:"home_n",label:"Slept at Home (0/1)",fn:e=>e.location==="Home"?1:0},
    {key:"elizabeth_n",label:"Slept at Elizabeth's (0/1)",fn:e=>e.location==="Elizabeth's"?1:0},
    {key:"alone_n",label:"Slept Alone (0/1)",fn:e=>e.sleptWith==="Alone"?1:0},
  ];

  // Add med timing factors
  const medNames=[...new Set(entries.flatMap(e=>(e.meds||[]).map(m=>m.name)))];
  medNames.forEach(name=>{
    factors.push({
      key:`med_${name}`,
      label:`${name} — hrs before bed`,
      fn:e=>{
        const m=(e.meds||[]).find(x=>x.name===name);
        return m?parseFloat(m.hrs):null;
      }
    });
  });

  const targetFn=target==="score"?e=>e.score:e=>e.duration;

  const results=factors.map(f=>{
    const pairs=entries.map(e=>({x:f.fn(e),y:targetFn(e)}))
                       .filter(p=>p.x!=null&&p.y!=null);
    if(pairs.length<5)return null;
    const xs=pairs.map(p=>p.x),ys=pairs.map(p=>p.y);
    const {r,p}=pearsonR(xs,ys);
    if(r==null)return null;
    return{label:f.label,r,p,n:pairs.length};
  }).filter(Boolean).sort((a,b)=>Math.abs(b.r)-Math.abs(a.r));

  return(
    <div className="page">
      <div style={{marginBottom:14}}>
        <label className="field-label">Outcome to analyze</label>
        <select value={target} onChange={e=>setTarget(e.target.value)} style={{maxWidth:300}}>
          <option value="score">Sleep Score</option>
          <option value="duration">Sleep Duration</option>
        </select>
      </div>

      <div className="card">
        <div className="card-title">Correlation Results</div>
        {results.map(({label,r,p,n})=>(
          <div key={label} style={{marginBottom:14}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
              <span style={{fontSize:13,color:"var(--text)"}}>{label}</span>
              <div style={{display:"flex",gap:8,alignItems:"center"}}>
                {p<0.05&&<span style={{fontSize:10,background:"rgba(88,166,255,.15)",color:BLUE,padding:"2px 6px",borderRadius:10}}>sig</span>}
                <span style={{fontSize:14,fontWeight:700,fontFamily:"monospace",color:r>0?GREEN:RED}}>{r>0?"+":""}{r}</span>
              </div>
            </div>
            <div className="corr-bar">
              <div className="corr-fill" style={{
                width:`${Math.abs(r)*100}%`,
                background:r>0?GREEN:RED,
                marginLeft:r<0?`${(1-Math.abs(r))*100}%`:0
              }}/>
            </div>
            <div style={{fontSize:10,color:MUTED}}>{corrStrength(r)} · p={p} · n={n}</div>
          </div>
        ))}
        {results.length===0&&<div style={{color:MUTED,fontSize:13}}>Not enough data for correlations yet.</div>}
        <div className="info-box" style={{marginTop:8}}>
          Pearson r: positive = better sleep, negative = worse sleep. "sig" = p &lt; 0.05 (statistically significant).
        </div>
      </div>
    </div>
  );
}

// ── MED TIMING TAB ────────────────────────────────────────────────────────────
function MedTimingTab({entries}){
  const medNames=[...new Set(entries.flatMap(e=>(e.meds||[]).map(m=>m.name)))];
  const [selMed,setSelMed]=useState(medNames[0]||"");
  const [threshold,setThreshold]=useState(8);

  if(entries.length<5)return(
    <div className="page" style={{textAlign:"center",padding:60,color:MUTED}}>
      Need at least 5 nights of data.
    </div>
  );

  if(!medNames.length)return(
    <div className="page" style={{textAlign:"center",padding:60,color:MUTED}}>
      No medication data found yet.
    </div>
  );

  const medEntries=entries.map(e=>{
    const m=(e.meds||[]).find(x=>x.name===selMed);
    if(!m)return null;
    return{hrs:parseFloat(m.hrs),score:e.score,duration:e.duration};
  }).filter(Boolean);

  const {r:rScore,p:pScore}=pearsonR(medEntries.map(e=>e.hrs),medEntries.map(e=>e.score));
  const early=medEntries.filter(e=>e.hrs>=threshold);
  const late=medEntries.filter(e=>e.hrs<threshold);
  const avgE=early.length?Math.round(early.reduce((a,b)=>a+b.score,0)/early.length*10)/10:null;
  const avgL=late.length?Math.round(late.reduce((a,b)=>a+b.score,0)/late.length*10)/10:null;

  return(
    <div className="page">
      <div style={{marginBottom:14}}>
        <label className="field-label">Medication</label>
        <select value={selMed} onChange={e=>setSelMed(e.target.value)} style={{maxWidth:300}}>
          {medNames.map(n=><option key={n}>{n}</option>)}
        </select>
      </div>

      <div className="metric-grid">
        <div className="metric">
          <div className="metric-label">Avg Hrs Before Bed</div>
          <div className="metric-value">{medEntries.length?Math.round(medEntries.reduce((a,b)=>a+b.hrs,0)/medEntries.length*10)/10:0}h</div>
          <div className="metric-sub">{medEntries.length} nights</div>
        </div>
        {rScore!=null&&(
          <div className="metric">
            <div className="metric-label">r vs Sleep Score</div>
            <div className="metric-value" style={{color:rScore>0?GREEN:RED}}>{rScore>0?"+":""}{rScore}</div>
            <div className="metric-sub">{corrStrength(rScore)} · {pScore<0.05?"✓ sig":"not sig"}</div>
          </div>
        )}
      </div>

      <div className="card">
        <div className="card-title">Early vs Late Dose</div>
        <div style={{marginBottom:12}}>
          <label className="field-label">Early = taken ≥ X hrs before bed</label>
          <input type="number" value={threshold} min="1" max="20" step="0.5"
                 onChange={e=>setThreshold(parseFloat(e.target.value))}
                 style={{maxWidth:120}}/>
        </div>
        <div className="grid2">
          {[["Early (≥"+threshold+"h)",avgE,early.length,GREEN],["Late (<"+threshold+"h)",avgL,late.length,RED]].map(([label,avg,n,color])=>(
            <div key={label} style={{background:"var(--surface2)",border:`1px solid var(--border)`,borderRadius:8,padding:14,textAlign:"center"}}>
              <div style={{fontSize:11,color:MUTED,marginBottom:6}}>{label}</div>
              <div style={{fontSize:28,fontWeight:700,fontFamily:"monospace",color:avg!=null?color:MUTED}}>{avg!=null?avg:"—"}</div>
              <div style={{fontSize:11,color:MUTED,marginTop:4}}>avg score · n={n}</div>
            </div>
          ))}
        </div>
        <div className="info-box" style={{marginTop:10}}>
          Positive r = taking {selMed} earlier correlates with better sleep.
        </div>
      </div>

      {/* Scatter */}
      <div className="card">
        <div className="card-title">Hours Before Bed vs Sleep Score</div>
        <div style={{overflowX:"auto"}}>
          <svg viewBox="0 0 500 220" style={{width:"100%",maxWidth:500}}>
            {(()=>{
              if(!medEntries.length)return null;
              const minX=Math.min(...medEntries.map(e=>e.hrs));
              const maxX=Math.max(...medEntries.map(e=>e.hrs));
              const minY=Math.min(...medEntries.map(e=>e.score));
              const maxY=Math.max(...medEntries.map(e=>e.score));
              const px=(x)=>40+(x-minX)/(maxX-minX||1)*420;
              const py=(y)=>200-(y-minY)/(maxY-minY||1)*170;
              // Trend line
              let sumX=0,sumY=0,sumXY=0,sumX2=0,n=medEntries.length;
              medEntries.forEach(e=>{sumX+=e.hrs;sumY+=e.score;sumXY+=e.hrs*e.score;sumX2+=e.hrs*e.hrs;});
              const slope=(n*sumXY-sumX*sumY)/(n*sumX2-sumX*sumX);
              const intercept=(sumY-slope*sumX)/n;
              return(<>
                <line x1="40" y1="200" x2="460" y2="200" stroke="#21262d" strokeWidth="1"/>
                <line x1="40" y1="30" x2="40" y2="200" stroke="#21262d" strokeWidth="1"/>
                <line x1={px(minX)} y1={py(slope*minX+intercept)} x2={px(maxX)} y2={py(slope*maxX+intercept)} stroke={ORANGE} strokeWidth="2" strokeDasharray="5,3"/>
                {medEntries.map((e,i)=>(
                  <circle key={i} cx={px(e.hrs)} cy={py(e.score)} r="5" fill={BLUE} opacity=".75"/>
                ))}
                <text x="250" y="218" textAnchor="middle" fontSize="10" fill={MUTED}>Hours Before Bed</text>
                <text x="12" y="115" textAnchor="middle" fontSize="10" fill={MUTED} transform="rotate(-90,12,115)">Score</text>
              </>);
            })()}
          </svg>
        </div>
      </div>
    </div>
  );
}

// ── SETTINGS SIDEBAR ──────────────────────────────────────────────────────────
function SettingsPanel({gsheets,setGsheets,syncStatus}){
  return(
    <div style={{padding:16}}>
      <div style={{fontSize:11,fontWeight:700,letterSpacing:".08em",textTransform:"uppercase",color:BLUE,marginBottom:12}}>Google Sheets Sync</div>
      <div style={{marginBottom:10}}>
        <label className="field-label">Spreadsheet ID</label>
        <input type="text" value={gsheets.sheetId} placeholder="From sheet URL"
               onChange={e=>setGsheets(g=>({...g,sheetId:e.target.value}))}/>
        <div style={{fontSize:10,color:MUTED,marginTop:4}}>From the sheet URL: /spreadsheets/d/<strong>ID</strong>/edit</div>
      </div>
      <div style={{marginBottom:10}}>
        <label className="field-label">Access Token</label>
        <input type="text" value={gsheets.token} placeholder="OAuth token"
               onChange={e=>setGsheets(g=>({...g,token:e.target.value}))}/>
      </div>
      {syncStatus&&(
        <div className={`sync-status ${syncStatus==="synced"?"sync-ok":syncStatus==="syncing"?"sync-ing":"sync-err"}`} style={{marginTop:8}}>
          {syncStatus==="synced"?"✓ Synced":syncStatus==="syncing"?"⟳ Syncing…":"✕ Sync failed"}
        </div>
      )}
      <div style={{marginTop:12,fontSize:11,color:MUTED}}>Data is always saved locally. Google Sheets is a backup only.</div>
    </div>
  );
}

// ── APP ───────────────────────────────────────────────────────────────────────
function App(){
  const [tab,setTab]=useState("log");
  const [entries,setEntries]=useState(()=>{
    try{return JSON.parse(localStorage.getItem("sleep_entries")||"[]");}
    catch{return[];}
  });
  const [showSettings,setShowSettings]=useState(false);
  const [gsheets,setGsheets]=useState(()=>{
    try{return JSON.parse(localStorage.getItem("sleep_gsheets")||'{"sheetId":"","token":""}');}
    catch{return{sheetId:"",token:""};}
  });
  const [syncStatus,setSyncStatus]=useState(null);

  useEffect(()=>{
    localStorage.setItem("sleep_entries",JSON.stringify(entries));
  },[entries]);

  useEffect(()=>{
    localStorage.setItem("sleep_gsheets",JSON.stringify(gsheets));
  },[gsheets]);

  const handleSave=async(entry)=>{
    const updated=[...entries,entry];
    setEntries(updated);
    showToast("✓ Entry saved");

    // Sync to sheets
    if(gsheets.sheetId&&gsheets.token){
      setSyncStatus("syncing");
      try{
        const row=[
          entry.date,entry.bedtime,entry.duration,entry.score,
          entry.exercised?1:0,entry.exIntensity,entry.stress,
          entry.workedLate?1:0,entry.location,entry.sleptWith,
          entry.events,entry.notes,
          JSON.stringify(entry.meds||[])
        ];
        const ok=await appendToSheet(gsheets.sheetId,gsheets.token,row);
        setSyncStatus(ok?"synced":"error");
        setTimeout(()=>setSyncStatus(null),3000);
      }catch{
        setSyncStatus("error");
        setTimeout(()=>setSyncStatus(null),3000);
      }
    }
  };

  const TABS=[
    {id:"log",label:"📝 Log Night"},
    {id:"data",label:"📊 Data"},
    {id:"corr",label:"🔗 Correlations"},
    {id:"med",label:"💊 Med Timing"},
  ];

  return(
    <div>
      <div className="nav">
        <div className="nav-brand">🌙 Sleep Tracker</div>
        {TABS.map(t=>(
          <div key={t.id} className={`nav-tab ${tab===t.id?"active":""}`}
               onClick={()=>setTab(t.id)}>{t.label}</div>
        ))}
        <div className="nav-tab" style={{marginLeft:"auto"}} onClick={()=>setShowSettings(v=>!v)}>⚙️</div>
        {syncStatus&&(
          <div className={`sync-status ${syncStatus==="synced"?"sync-ok":syncStatus==="syncing"?"sync-ing":"sync-err"}`} style={{margin:"0 8px"}}>
            {syncStatus==="synced"?"✓":syncStatus==="syncing"?"⟳":"✕"}
          </div>
        )}
      </div>

      {showSettings&&(
        <div style={{background:"var(--surface)",borderBottom:"1px solid var(--border)"}}>
          <SettingsPanel gsheets={gsheets} setGsheets={setGsheets} syncStatus={syncStatus}/>
        </div>
      )}

      {tab==="log"&&<LogTab onSave={handleSave} gsheets={gsheets}/>}
      {tab==="data"&&<DataTab entries={entries}/>}
      {tab==="corr"&&<CorrTab entries={entries}/>}
      {tab==="med"&&<MedTimingTab entries={entries}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
